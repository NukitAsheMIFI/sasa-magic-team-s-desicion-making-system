
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spr_diff_service
    ports:
      - "8000:8000"
    volumes:
      # Проброс датасета (2002 заявки) внутрь контейнера
      - ./src/data:/app/src/data
      # Монтирование пользовательских скриптов и проверок
      - ./src/scripts:/app/src/scripts
      - ./src/checks:/app/src/checks
    #restart: unless-stopped